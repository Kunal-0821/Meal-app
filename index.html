<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header section with title, search input, and favorites button -->
    <header>
        <h1>Meal Finder</h1>
        <input type="text" id="searchBox" placeholder="Search for a meal...">
        <button id="favBtn">My Favorites</button>
    </header>

    <!-- Container to display search results or meal suggestions -->
    <div id="mealContainer"></div>

    <script src="script.js"></script>
</body>
</html>
